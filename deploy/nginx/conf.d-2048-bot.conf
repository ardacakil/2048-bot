# /etc/nginx/conf.d/2048-bot.conf: http-level definitions for the 2048 bot snippet
# (/etc/nginx/snippets/ardacakil/2048-bot.conf). conf.d/*.conf is included inside nginx's http
# block, before the sites, so the zones exist when the snippet uses them.
#
# The Cloudflare real-IP config is not here: it is server-wide and belongs to the main-site
# repo. It is required once ardacakil.com is proxied, or the per-address limits below would
# apply to Cloudflare's addresses, i.e. to all visitors together.

# per-client limits: game starts, other API calls, concurrent streams
limit_req_zone  $binary_remote_addr zone=bot2048_play:10m rate=6r/m;
limit_req_zone  $binary_remote_addr zone=bot2048_api:10m  rate=2r/s;
limit_conn_zone $binary_remote_addr zone=bot2048_conn:10m;

# access log without client addresses: no $remote_addr, $http_x_forwarded_for or
# $http_cf_connecting_ip; request line, status, size and timing are kept
log_format bot2048_noip '[$time_local] "$request" $status $body_bytes_sent '
                        'rt=$request_time urt=$upstream_response_time';
