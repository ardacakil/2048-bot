# /etc/nginx/sites-available/2048.ardacakil.com: live 2048 bot (static site + /api/ -> bot2048)
# A new file only: no other site's config is touched. Enable with a symlink in sites-enabled,
# then `nginx -t` before reloading. `certbot --nginx -d 2048.ardacakil.com` adds the HTTPS parts
# (listen 443, certificate, HTTP->HTTPS redirect) to this file; see deploy/README.md.
#
# Replace PORT with BOT2048_PORT from /etc/bot2048.env.

# ---- http-level definitions (sites-enabled files are included inside nginx's http block)

# per-client limits for the play endpoint: 6 starts/min (burst 4: one per target at once),
# at most 2 concurrent streams per address (shared university/cafe Wi-Fi)
limit_req_zone  $binary_remote_addr zone=bot2048_play:10m rate=6r/m;
limit_req_zone  $binary_remote_addr zone=bot2048_api:10m  rate=2r/s;
limit_conn_zone $binary_remote_addr zone=bot2048_conn:10m;

# access log without client addresses: no $remote_addr, $http_x_forwarded_for or
# $http_cf_connecting_ip; request line, status, size and timing are kept
log_format bot2048_noip '[$time_local] "$request" $status $body_bytes_sent '
                        'rt=$request_time urt=$upstream_response_time';

server {
    listen 80;
    listen [::]:80;
    server_name 2048.ardacakil.com;

    access_log /var/log/nginx/2048.ardacakil.com.access.log bot2048_noip;
    error_log  /var/log/nginx/2048.ardacakil.com.error.log warn;

    # MANDATORY once Cloudflare proxying (orange cloud) is on, so the limits apply per visitor
    # and not to Cloudflare's addresses (= everyone together). Generated by
    # deploy/update-cloudflare-ips.sh. See "Switch to proxied" in deploy/README.md.
    # include /etc/nginx/snippets/bot2048-cloudflare-realip.conf;

    root /var/www/2048.ardacakil.com;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # TEMPORARY real-IP check (deploy/README.md section 8): answers each caller with the address
    # nginx sees for that caller, i.e. their own public address once the Cloudflare real-IP
    # include works, a Cloudflare edge address if it does not. Ships commented out; uncomment only
    # for the verification, then comment it out again (README step 8.4). Not logged with addresses.
    # location = /api/_ip { default_type text/plain; return 200 "$remote_addr\n"; }

    location /api/play/ {
        limit_req zone=bot2048_play burst=4 nodelay;
        limit_conn bot2048_conn 2;
        limit_req_status 429;
        limit_conn_status 429;

        proxy_pass http://127.0.0.1:PORT;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # stream moves as they are computed (the app also sends X-Accel-Buffering: no)
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        # queued clients get a message every 15 s; anything idle for 2 min is dead
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /api/ {
        limit_req zone=bot2048_api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:PORT;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }
}
