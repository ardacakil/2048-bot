# /etc/nginx/snippets/ardacakil/2048-bot.conf: the live 2048 bot at https://ardacakil.com/2048-bot/
#
# Location blocks only, included by the ardacakil.com server block, which lives in the main-site
# repo (HTTPS by certbot there) and must exist first. Needs the http-level zones and log format
# of /etc/nginx/conf.d/2048-bot.conf (deploy/nginx/conf.d-2048-bot.conf), and, once the domain
# is proxied by Cloudflare, the main site's real-IP config. See deploy/README.md.
#
# Replace PORT with BOT2048_PORT from /etc/bot2048.env.
#
# proxy_pass with a URI part replaces the matched /2048-bot/api/... prefix, so FastAPI keeps its
# /api/... routes. ^~ keeps the main site's regex locations (e.g. caching rules for \.js$) away
# from these paths.
#
# add_header in a location replaces every add_header the server block sets (nginx does not
# merge them): if the main site sets security headers at server level (HSTS, ...), repeat them
# in the static locations below. The headers here match src/server/dev.py (tests/test_web.py
# compares them).

location = /2048-bot {
    access_log /var/log/nginx/2048-bot.access.log bot2048_noip;
    return 301 /2048-bot/;
}

# the page: /var/www/2048-bot is a copy of web/ (deploy/deploy.sh)
location ^~ /2048-bot/ {
    root /var/www;
    index index.html;
    try_files $uri $uri/ =404;
    access_log /var/log/nginx/2048-bot.access.log bot2048_noip;

    # HTML, JS and CSS have no content hash in their names (no build step): revalidate on every
    # load, which costs a 304 per file when nothing changed
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # fonts and images: cached for 30 days; give a changed file a new name
    location ~* \.(?:woff2|webp|avif|jpg|png|svg)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}

# TEMPORARY real-IP check (deploy/README.md section 7): answers each caller with the address
# nginx sees for that caller. Ships commented out; uncomment only for the check, then comment it
# out again. Not logged with addresses.
# location = /2048-bot/api/_ip { default_type text/plain; return 200 "$remote_addr\n"; }

# one game per request, streamed as Server-Sent Events
location ^~ /2048-bot/api/play/ {
    # 6 starts/min per address (burst 4: one per target at once), 2 concurrent streams per
    # address (shared university/cafe Wi-Fi). A safety net: the page itself allows one game
    # per target per page load.
    limit_req zone=bot2048_play burst=4 nodelay;
    limit_conn bot2048_conn 2;
    limit_req_status 429;
    limit_conn_status 429;
    access_log /var/log/nginx/2048-bot.access.log bot2048_noip;

    proxy_pass http://127.0.0.1:PORT/api/play/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;

    # stream moves as they are computed (the app also sends X-Accel-Buffering: no)
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    # queued clients get a message every 15 s; anything idle for 2 min is dead
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

# /api/health, /api/stats
location ^~ /2048-bot/api/ {
    limit_req zone=bot2048_api burst=20 nodelay;
    limit_req_status 429;
    access_log /var/log/nginx/2048-bot.access.log bot2048_noip;

    proxy_pass http://127.0.0.1:PORT/api/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_read_timeout 30s;
}
