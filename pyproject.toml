[project]
name = "2048-bot"
version = "0.1.0"
description = "Self-trained 2048 bot: n-tuple network (TD learning) vs DQN"
readme = "README.md"
authors = [
    { name = "ardacakil", email = "ardacakil4@gmail.com" }
]
requires-python = ">=3.12"
# the engine, network, search and server need only these; see [dependency-groups] for the rest
dependencies = [
    "numpy",
    "numba",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# src/ holds several top-level packages: `import game`, `import ntuple`, `import dqn`, `import analysis`,
# `import server`
module-name = ["game", "ntuple", "dqn", "analysis", "server"]
module-root = "src"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ipykernel",
    "ipywidgets",
    "jupyter",
    "httpx",
]
# notebooks, figures, evaluation summaries (src/analysis)
analysis = [
    "matplotlib",
    "pandas",
]
# the live API (src/server); the VPS installs only numpy, numba and this group, pinned in
# deploy/requirements-server.txt (uv export --no-default-groups --group server ...)
server = [
    "fastapi",
    "uvicorn",
]

[tool.uv]
# on the Mac everything is installed, as before
default-groups = ["dev", "analysis", "server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests write real 256 MB checkpoints: keep temp dirs only for failing tests
tmp_path_retention_policy = "failed"
